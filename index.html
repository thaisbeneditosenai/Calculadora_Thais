<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular tabuadas</title>

    <style>
        #txtn1, #txtn2{
            width: 80px;
        }

        #principal{
            width: 500px;
            margin: 0 auto;
            text-align: center;
            background-color: brown;
            border: 2px solid black;
            margin-top: 100px;
            color: bisque;
        }
        
        #botao{
            margin-top: 15px;
            color: red;
        }

        #resultado{
            margin-top: 20px;
            background-color: bisque;
            color: black;
            padding: 5px 5px;
        }
    </style>


</head>
<body>


    <div id="principal">
        <h1>TABUADA</h1>
        <input type="number" name="txtn1" id="txtn1"> 
        <div id="botao">
            <button type="button" name="calcular" id="calcular">CALCULAR</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
